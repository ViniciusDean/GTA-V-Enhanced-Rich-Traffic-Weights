[RichTrafficWeights]
Enabled=true
ZonePollMs=1000
; Seconds between re-rolls of which models are allowed in the current zone.
SportCycleSeconds=30
; Sport and exotic chances are multiplied by this between NightStartHour and NightEndHour.
NightSportMultiplier=1.5
NightStartHour=21
NightEndHour=5
; Sport and exotic chances are multiplied by this in rain, thunder and snow.
RainFastMultiplier=0.5

AntiRepeatEnabled=true
RepeatScanMs=5000
RepeatRadiusMeters=180
RepeatLimit=2
RepeatCooldownSeconds=90
MaxRepeatCooldownModels=32

ToggleKey=F10
; Re-reads this file in game (None disables it).
ReloadKey=F11
DebugOverlay=false
DebugTelemetry=false
LogAntiRepeat=true

; Per-zone chance (0.0 - 1.0) that each model of a tier is allowed to spawn.
; Tiers: Daily, Luxury, Sport, Exotic (supercars/hypercars).
; Built-in defaults cover 28 zones; any [Zone.NAME] section below overrides
; them or adds a new zone (NAME = GTA zone code, e.g. ROCKF, DAVIS, VINE).
; Zones without a profile are left untouched (vanilla traffic).
[Zone.ROCKF]
Daily=1.0
Luxury=1.0
Sport=0.35
Exotic=0.15

[Zone.DAVIS]
Daily=0.85
Luxury=0.15
Sport=0.04
Exotic=0.01

; Per-model multiplier on top of the zone chance: 0 = never, 1 = normal,
; 2 = twice as likely. Use spawn names (gtacars.net lists them).
[Models]
; pipistrello=0.5
; dominator9=2
